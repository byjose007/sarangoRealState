# Local dev:      docker compose up db
#                  (Postgres only — run `npm run dev` on the host against it)
# Full stack:      docker compose --profile full up -d --build
#                  (Postgres + the built Next.js image + nginx in front of it)

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vestra}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vestra}
      POSTGRES_DB: ${POSTGRES_DB:-vestra}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-vestra} -d ${POSTGRES_DB:-vestra}']
      interval: 5s
      timeout: 5s
      retries: 10

  # One-off: applies pending migrations, then exits. Uses the `builder`
  # stage (has the full Prisma CLI + schema engine) rather than the slim
  # runtime image, which intentionally doesn't carry migration tooling.
  migrate:
    profiles: ['full']
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-vestra}:${POSTGRES_PASSWORD:-vestra}@db:5432/${POSTGRES_DB:-vestra}
    command: ['npx', 'prisma', 'migrate', 'deploy']
    depends_on:
      db:
        condition: service_healthy

  web:
    profiles: ['full']
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-vestra}:${POSTGRES_PASSWORD:-vestra}@db:5432/${POSTGRES_DB:-vestra}
      UPLOADS_DIR: /app/uploads
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    expose:
      - '3000'

  nginx:
    profiles: ['full']
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - '80:80'
      # - '443:443'   # uncomment once TLS certs are mounted
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - uploads:/usr/share/nginx/uploads:ro
    depends_on:
      - web

volumes:
  postgres_data:
  uploads:
