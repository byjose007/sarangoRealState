# HTTPS is not live yet — this file only serves plain HTTP for now. Once
# there's a real domain pointed at the VPS, follow "Enabling HTTPS" in the
# README: it walks through obtaining the certificate with the `certbot`
# service in docker-compose.yml, then tells you exactly which lines below
# to uncomment. Nothing here needs to change before that.

server {
    listen 80;
    server_name _;

    client_max_body_size 25m;

    # Required for Let's Encrypt's HTTP-01 challenge (the `certbot` compose
    # service writes into this webroot). Keep this location active even
    # after HTTPS is enabled — cert renewal reuses it.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # --- Enable once a certificate exists at /etc/letsencrypt/live/<domain> ---
    # (see README "Enabling HTTPS"): replaces the two location blocks below
    # with a single redirect, since the 443 server block re-declares them.
    #
    # location / {
    #     return 301 https://$host$request_uri;
    # }

    # Uploaded property images/documents are served straight off the shared
    # volume so requests never hit Node for static file bytes.
    location /uploads/ {
        alias /usr/share/nginx/uploads/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    location / {
        proxy_pass http://web:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

